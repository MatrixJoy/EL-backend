version: "2"
sql:
  - engine: postgresql
    schema:
      - db/migrations/000001_initial.up.sql
      - db/migrations/000002_catalog.up.sql
      - db/migrations/000003_identity.up.sql
      - db/migrations/000004_auth_replay.up.sql
      - db/migrations/000006_retell_attempts.up.sql
      - db/migrations/000007_search_content.up.sql
      - db/migrations/000008_vocabulary_book.up.sql
      - db/migrations/000009_dictionary.up.sql
      - db/migrations/000010_grammar_attempts.up.sql
      - db/migrations/000011_vocabulary_review.up.sql
    queries: db/queries
    gen:
      go:
        package: dbgen
        out: internal/repository/dbgen
        sql_package: pgx/v5
        emit_json_tags: true
        emit_empty_slices: true
        emit_interface: true
        overrides:
          - db_type: uuid
            go_type:
              import: github.com/google/uuid
              type: UUID
